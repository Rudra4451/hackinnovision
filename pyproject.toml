[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-intelligence"
version = "1.0.0"
authors = [
    { name = "Member 2 - Planetary Terrain Intelligence Engineer" }
]
description = "Autonomous Mars Rover Terrain Intelligence Module (Hackathon Project Odyssey)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "core*", "terrain_intelligence*", "visionscore*", "api*"]
exclude = ["frontend*", "tests*", "outputs*", "data*", "ODYSSEY-MARS09*"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
